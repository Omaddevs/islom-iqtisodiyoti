# Namuna: /etc/nginx/sites-available/islomiqtisod.uz
# Frontend (Vite build → dist/) statik fayl, /api va /ws esa backend'ga (127.0.0.1:4020).
# HTTPS shart: brauzer kamera/mikrofonga faqat HTTPS'da ruxsat beradi (certbot --nginx).

server {
  listen 80;
  server_name islomiqtisod.uz www.islomiqtisod.uz;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name islomiqtisod.uz www.islomiqtisod.uz;

  ssl_certificate     /etc/letsencrypt/live/islomiqtisod.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/islomiqtisod.uz/privkey.pem;

  root /var/www/islom-iqtisodiyoti/dist;
  index index.html;

  # Dars yozuvlari va rasmlar (data-URL) uchun
  client_max_body_size 500m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Hash'li assetlar — uzoq kesh
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # login cheklovi shu IP bo'yicha ishlaydi
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;                     # katta yozuv yuklashlari
    proxy_read_timeout 300s;
  }

  location /ws {
    proxy_pass http://127.0.0.1:4020;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 3600s;
  }

  # SPA (hash-router): qolgan hamma narsa index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
