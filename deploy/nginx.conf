# /etc/nginx/sites-available/islom-iqtisodiyoti (deploy.sh sertifikat bo'lsa shuni o'rnatadi)
# Frontend (Vite build → dist/) statik fayl, /api va /ws esa backend'ga (127.0.0.1:4020).
# HTTPS shart: brauzer kamera/mikrofonga faqat HTTPS'da ruxsat beradi (certbot --nginx).

# HTTP (domen yoki IP) → HTTPS. Sertifikatni yangilash (certbot renew, webroot) shu yerdan o'tadi
server {
  listen 80 default_server;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://islom-iqtisodiyoti.uz$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name islom-iqtisodiyoti.uz www.islom-iqtisodiyoti.uz;

  ssl_certificate     /etc/letsencrypt/live/islom-iqtisodiyoti.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/islom-iqtisodiyoti.uz/privkey.pem;

  root /var/www/islom-iqtisodiyoti/dist;
  index index.html;

  # Dars yozuvlari va rasmlar (data-URL) uchun
  client_max_body_size 500m;

  # JSON (platforma ma'lumotlari), JS va CSS siqib yuboriladi
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/json application/javascript text/css image/svg+xml text/plain;

  add_header X-Content-Type-Options nosniff always;
  # Brauzer bu saytni bundan keyin faqat HTTPS orqali ochadi
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Hash'li assetlar — uzoq kesh
  location /assets/ {
    expires 1y;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # login cheklovi shu IP bo'yicha ishlaydi
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;                     # katta yozuv yuklashlari
    proxy_read_timeout 300s;
  }

  location /ws {
    proxy_pass http://127.0.0.1:4020;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 3600s;
  }

  # SPA (hash-router): qolgan hamma narsa index.html
  location / {
    try_files $uri /index.html;
    # expires (add_header emas) — server darajasidagi xavfsizlik sarlavhalari saqlanib qoladi
    expires -1;
  }
}
