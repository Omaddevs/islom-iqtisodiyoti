# Vaqtinchalik: domen va SSL'gacha IP orqali (HTTP). Domen ulangach deploy/nginx.conf ga almashtiring.
server {
  listen 80 default_server;
  server_name _;

  # SSL sertifikatini olish (certbot --webroot) uchun
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

  root /var/www/islom-iqtisodiyoti/dist;
  index index.html;

  # Dars yozuvlari va rasmlar (data-URL) uchun
  client_max_body_size 500m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Hash'li assetlar — uzoq kesh
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # login cheklovi shu IP bo'yicha ishlaydi
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;                     # katta yozuv yuklashlari
    proxy_read_timeout 300s;
  }

  location /ws {
    proxy_pass http://127.0.0.1:4020;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 3600s;
  }

  # SPA (hash-router): qolgan hamma narsa index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
