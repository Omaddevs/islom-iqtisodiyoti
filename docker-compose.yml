# Lokal ishlab chiqish uchun PostgreSQL. Ishga tushirish: docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    container_name: islom-iqtisodiyoti-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: islom_iqtisodiyoti
      POSTGRES_USER: ii_app
      POSTGRES_PASSWORD: ii_dev_password
    ports:
      - "5436:5432"
    volumes:
      - ii_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ii_app -d islom_iqtisodiyoti"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ii_pgdata:
